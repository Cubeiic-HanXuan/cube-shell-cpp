# ===========================================================================
# cube-shell 跨平台构建 / 打包 CI
#
# 用 GitHub 托管 Runner 编译 6 个平台（本地无需对应架构机器）：
#   macOS   : Intel x86_64 (macos-15-intel)  + Apple Silicon ARM64 (macos-14)
#   Windows : x64 (windows-2022 / VS2022)    + ARM64 (windows-11-vs2026-arm / VS2026)
#   Linux   : x86_64 (ubuntu-22.04)          + ARM64 (ubuntu-22.04-arm)，apt 系统 Qt6
#             （用 22.04 而非最新版：链接更低版本 glibc，兼容更多旧发行版）
#
# 依赖：Qt6.9（install-qt-action / aqt，含 qtmultimedia + qtserialport）+ vcpkg manifest
#（vcpkg.json 只装第三方库：libssh2/openssl/yaml-cpp/zlib/freerdp/cjson；Qt 自身的
#  SerialPort/Multimedia 模块一律走 Qt 安装，【不要】放进 vcpkg——否则 vcpkg 会去
#  源码重编整套 qtbase，拖入 libpq/libb2 等 autotools 依赖链导致构建失败）。
# RDP 全平台开启（-DCUBESHELL_WITH_RDP=ON）。
#
# Windows ARM64 关键：必须带 vcpkg overlay 三参数（vcpkg-triplets / vcpkg-ports），
# 修复 OpenSSL ARM64 Release 被 MSVC 误编译导致 RDP TLS 握手崩溃——这两个 overlay
# 目录已提交进仓库（见 BUILD-Windows-ARM64.md）。
#
# 触发：
#   - 仅手动 workflow_dispatch（Actions → build → Run workflow）。
#     打 v* tag 时手动触发并勾选/填入该 tag，可同时产出 GitHub Release。
# 产物：每次构建上传 6 个 Artifact；当 ref 是 v* tag 时额外自动创建 GitHub Release。
#
# 注意：ARM64 托管 Runner（windows-11-vs2026-arm / ubuntu-22.04-arm）对【公开仓库】免费。
#       若本仓库为私有，这些 label 会一直排队，需改用私有 Runner 或先把仓库转公开。
# ===========================================================================

name: build

on:
  workflow_dispatch:

# 同一分支/PR 重复触发时取消旧 run，省 Runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.9.1'
  # 应用自身版本号（打包文件名用），与 Qt 版本无关；发版时手动改这里
  APP_VERSION: '3.4.0'
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 仅 linux-x86_64 在 matrix 里定义了 container: rockylinux:8，其余平台该键为空 →
    # 此处置空即不在容器内跑。必须放在 job 顶层（matrix 里的 container 键不会自动生效）。
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false          # 一个平台失败不取消其余平台
      matrix:
        include:
          # ==================================================================
          # 调试模式：暂时只跑 Linux 两个平台，macOS / Windows 先注释掉。
          # 调好 Linux 后，取消下面 macOS / Windows 段的注释即可恢复全平台。
          # ==================================================================

          # ------------------------------- macOS -------------------------------
          - name: macos-x86_64
            os: macos-15-intel          # Intel runner
            platform: macos
            qt_arch: clang_64
            vcpkg_triplet: x64-osx
            osx_arch: x86_64

          - name: macos-arm64
            os: macos-14                # Apple Silicon runner
            platform: macos
            qt_arch: clang_64           # Apple Silicon 上 clang_64 即 arm64
            vcpkg_triplet: arm64-osx
            osx_arch: arm64

          # ------------------------------ Windows ------------------------------
          # x64 固定跑 windows-2022（VS 2022 仍在，generator「Visual Studio 17 2022」）。
          # 不追 windows-latest：它正灰度迁到 VS 2026，VS17 generator 会找不到实例。
          # 用 VS2022 也与 BUILD-Windows-ARM64.md 里 overlay 验证的 MSVC 版本一致。
          - name: windows-x86_64
            os: windows-2022
            platform: windows
            qt_arch: win64_msvc2022_64
            vcpkg_triplet: x64-windows-static-md
            vs_generator: Visual Studio 17 2022
            vs_arch: x64
            overlay: 'false'            # x64 无需 OpenSSL ARM64 overlay

          # ARM64 基础镜像 windows-11-arm 不带 Visual Studio，必须用带 VS2026 的
          # windows-11-vs2026-arm（public preview，CMake 4.3.3，支持 VS18 generator）。
          # triplet 用 -static-md（动态 CRT）与 Qt 预编译包(/MD)对齐，否则 LNK2038。
          - name: windows-arm64
            os: windows-11-vs2026-arm
            platform: windows
            qt_arch: win64_msvc2022_arm64
            vcpkg_triplet: arm64-windows-static-md
            vs_generator: Visual Studio 18 2026
            vs_arch: ARM64
            overlay: 'true'             # 必须：修 OpenSSL ARM64 RDP 崩溃

          # ------------------------------- Linux -------------------------------
          # Qt 用 aqt 装 6.9（与 macOS/Windows 对齐），install-qt-action 官方不支持
          # Linux，故直接调 aqt 命令。aqt 的 host/arch（经 probe 实测确认）：
          #   x86_64 → host=linux        arch=linux_gcc_64（不是 gcc_64！）
          #   ARM64  → host=linux_arm64  arch=linux_gcc_arm64（Qt≥6.7 才有 ARM64 桌面包）
          #
          # 两个架构的构建底座不同（glibc 兼容性权衡）：
          #   x86_64 用【Rocky Linux 8 容器】（glibc 2.28）：Qt 6.9 官方 x86_64 二进制
          #     的 glibc 底线即 2.28（RHEL8 参考平台），在这里构建出的包可跑在
          #     CentOS/RHEL/Rocky/Alma 8+、Ubuntu 20.04+、Debian 11+、Fedora 34+ 等
          #     一切 glibc ≥ 2.28 的发行版（glibc 向下兼容）。容器里 dnf 装依赖。
          #     （要再往下兼容 CentOS 7/glibc 2.17 得从源码重编 Qt，成本极高，不走。）
          #   ARM64 用 ubuntu-24.04（glibc 2.39）：Qt 官方 ARM64 Linux 二进制【只】在
          #     Ubuntu 24.04 上编译（ARM64 参考平台即 24.04/glibc2.39，glibc 更旧需从
          #     源码重编 Qt）。22.04 上其 moc 报 GLIBC_2.38 not found，故 ARM64 只能 24.04。
          - name: linux-x86_64
            os: ubuntu-22.04           # 宿主 runner（仅承载容器，自身发行版不参与编译）
            container: rockylinux:8    # 构建在容器内进行：glibc 2.28 底座
            platform: linux
            aqt_host: linux
            aqt_arch: linux_gcc_64    # 实测 6.9.1 x86_64 唯一 arch 名（非 gcc_64）
            vcpkg_triplet: x64-linux

          - name: linux-arm64
            os: ubuntu-24.04-arm      # Qt ARM64 Linux 官方二进制基于 24.04/glibc2.39，22.04 跑不动 moc
            platform: linux
            aqt_host: linux_arm64
            aqt_arch: linux_gcc_arm64
            vcpkg_triplet: arm64-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------- Linux 构建期系统依赖
      # Qt Multimedia(QAudioSource) 需要 ALSA/pulse 头文件；X11/GL/fontconfig 等是
      # Qt GUI 与 vcpkg 构建 FreeRDP 的常规依赖。
      # x86_64 在 Rocky 8 容器内（dnf，root 无 sudo）；ARM64 在 ubuntu-24.04-arm 裸机（apt）。
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          set -e
          if [ -f /etc/redhat-release ]; then
            # ---------- Rocky Linux 8 容器（x86_64）：dnf ----------
            # 容器内即 root，无 sudo。git/tar/which 是 actions/checkout 与脚本的硬依赖。
            dnf install -y epel-release
            dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled PowerTools || true
            dnf install -y \
              gcc gcc-c++ make ninja-build pkgconfig ccache \
              python3.11 python3.11-pip \
              git tar which xz unzip zip perl-core \
              mesa-libGL-devel mesa-libGLU-devel \
              libxkbcommon-devel libxkbcommon-x11-devel \
              fontconfig-devel dbus-devel \
              alsa-lib-devel pulseaudio-libs-devel \
              libX11-devel libXext-devel libXfixes-devel libXi-devel libXrender-devel \
              libxcb-devel xcb-util-keysyms-devel xcb-util-image-devel \
              xcb-util-wm-devel xcb-util-renderutil-devel xcb-util-devel \
              libXinerama-devel \
              wayland-devel libwayland-client libwayland-cursor libwayland-egl \
              bison flex gperf
            # Rocky 8 自带 GCC 8.5（2018），不满足 Qt 6.9 对 C++17 noexcept 比较运算符的
            # 要求——会报 "static assertion failed: Use *_NON_NOEXCEPT version of the macro"
            # （Qt 头文件 qmetatype.h/qvariant.h/qdatetime.h 等大面积 static_assert 失败）。
            # 用官方 gcc-toolset-11（GCC 11，装在 /opt/rh，不改系统 glibc）顶替。
            # 保留 glibc 2.28 底座不变（这是我们选 Rocky 8 的目的），只换编译器。
            dnf install -y gcc-toolset-11-gcc gcc-toolset-11-gcc-c++ || \
              dnf install -y gcc-toolset-12-gcc gcc-toolset-12-gcc-c++
            # 激活 toolset：把它的 bin 放 PATH 最前，并显式设 CC/CXX。
            # 注意 source .../enable 只对当前 shell 有效，CI 每步是新 shell，必须写进
            # GITHUB_PATH / GITHUB_ENV 让后续 Configure/Build 步骤都用 GCC 11。
            TSBIN="$(ls -d /opt/rh/gcc-toolset-1*/root/usr/bin 2>/dev/null | sort -V | tail -n1)"
            if [ -n "$TSBIN" ]; then
              echo "$TSBIN" >> "$GITHUB_PATH"
              echo "CC=$TSBIN/gcc"  >> "$GITHUB_ENV"
              echo "CXX=$TSBIN/g++" >> "$GITHUB_ENV"
              # vcpkg 的 x64-linux triplet 走 cc/c++（不读 CC/CXX 环境变量）。toolset 的
              # bin 里通常已带 cc→gcc 软链，但为防 vcpkg 绕过 PATH 命中 /usr/bin/cc(GCC8)，
              # 在 /usr/local/bin（PATH 靠前）显式补 cc/c++ 指向 toolset 的 gcc/g++。
              ln -sf "$TSBIN/gcc" /usr/local/bin/cc
              ln -sf "$TSBIN/g++" /usr/local/bin/c++
              echo "/usr/local/bin" >> "$GITHUB_PATH"
              echo "gcc-toolset activated: $TSBIN"
              "$TSBIN/g++" --version | head -1
            else
              echo "WARNING: 未找到 gcc-toolset bin，仍用系统默认 gcc" >&2
            fi
            # Rocky 8 默认 python3 是 3.6（太老），把 3.11 顶到前面（不影响 dnf，它用 platform-python）
            alternatives --set python3 /usr/bin/python3.11 || \
              ln -sf /usr/bin/python3.11 /usr/local/bin/python3
          else
            # ---------- ubuntu-24.04-arm 裸机（ARM64）：apt ----------
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential ninja-build pkg-config ccache python3-pip \
              libgl1-mesa-dev libglu1-mesa-dev \
              libxkbcommon-dev libxkbcommon-x11-dev \
              libfontconfig1-dev libdbus-1-dev \
              libasound2-dev libpulse-dev \
              libx11-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
              libxcb1-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev \
              libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev \
              libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev \
              libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev \
              bison flex gperf python3
          fi

      # 容器内 git 把挂进来的工作区判为「非本用户目录」会拒操作（dubious ownership）。
      # 必须在任何 vcpkg clone / 子模块读取之前放行；仅容器（Rocky 8）需要。
      # 注意：此步骤必须在安装 git 之后执行（上面的 dnf install 包含 git）。
      - name: Trust workspace git dir (container)
        if: matrix.name == 'linux-x86_64'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # ------------------------------------------------------------------ Qt
      # 仅 macOS / Windows 用 install-qt-action；Linux 该 action 官方不支持，走下方 aqt。
      - name: Install Qt ${{ env.QT_VERSION }} (${{ matrix.qt_arch }})
        if: matrix.platform != 'linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: 'qtmultimedia qtserialport'
          cache: 'true'
          cache-key-prefix: 'qt-${{ matrix.name }}'

      # ------------------------------------------------------------- vcpkg
      # vcpkg 用 manifest 模式（仓库根 vcpkg.json）。缓存 installed 目录避免每次
      # 全量重编 OpenSSL/FreeRDP（首次约 10–20 分钟，命中缓存后秒级）。
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'vcpkg-triplets/**', 'vcpkg-ports/**') }}
          restore-keys: vcpkg-${{ matrix.name }}-

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ ! -x "${VCPKG_ROOT}/vcpkg" ] && [ ! -f "${VCPKG_ROOT}/vcpkg.exe" ]; then
            rm -rf "${VCPKG_ROOT}"
            git clone --depth 1 https://github.com/microsoft/vcpkg "${VCPKG_ROOT}"
            # manifest 模式要靠 vcpkg.json 的 builtin-baseline 去 `git show` 历史里的
            # versions/baseline.json。但 --depth 1 浅克隆【不含】该历史 commit，会报：
            #   "failed to `git show` versions/baseline.json ... exists on disk, but not in <commit>"
            # 故显式把 baseline commit 抓取下来（--depth 1 定向 fetch，实测可成功）。
            # baseline 从 vcpkg.json 动态读取，以后改 baseline 无需动这里。
            BASELINE="$(sed -n 's/.*"builtin-baseline"[^"]*"\([0-9a-f]\{40\}\)".*/\1/p' vcpkg.json | head -n1)"
            if [ -n "$BASELINE" ]; then
              git -C "${VCPKG_ROOT}" fetch --depth 1 origin "$BASELINE" || \
                git -C "${VCPKG_ROOT}" fetch --unshallow origin   # 兜底：定向 fetch 失败则拉全历史
            fi
            if [ "${{ runner.os }}" = "Windows" ]; then
              "${VCPKG_ROOT}/bootstrap-vcpkg.bat" -disableMetrics
            else
              "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
            fi
          fi

      # Linux 需要新版 CMake（≥3.27）：vcpkg master 的脚本 z_vcpkg_spdx.cmake 用到
      # string(JSON ... STRING_ENCODE)（CMake 3.27 引入）。x86_64 上 vcpkg-cmake 端口
      # 能下载官方预编译新 cmake；但 ARM64 Linux 无官方预编译 cmake，vcpkg 回退用
      # 系统 cmake——ubuntu-22.04 apt 自带的是 3.22，太旧会报
      #   "string sub-command JSON got an invalid mode 'STRING_ENCODE'"
      # 故用 pip 装新版 cmake（x86_64/aarch64 均有 wheel），置于 PATH 最前覆盖旧版。
      - name: Install recent CMake (Linux)
        if: matrix.platform == 'linux'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install 'cmake>=3.30' ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cmake --version
          ninja --version

      # Linux：用 aqt 装 Qt ${{ env.QT_VERSION }}（与 macOS/Windows 对齐到 6.9）。
      # install-qt-action 官方不支持 Linux（"Linux x86 packages are not supported"），
      # 故直接调 aqt 命令。
      #
      # 两个关键点（均经 probe 实测确认）：
      #   1) arch 名：x86_64 是 linux_gcc_64（不是 gcc_64），ARM64 是 linux_gcc_arm64。
      #      用错 arch 名会导致 aqt 找不到 qt_base，报 "packages not found while parsing XML"。
      #   2) aqt 必须从 git master 装（PyPI 3.3.0 解析不了 Qt 6.9 仓库 XML，
      #      issue #1007），且要用独立 venv 装——ubuntu-22.04 系统 Python3.10 自带的
      #      packaging 21.3 与 aqt git 版的依赖（需 packaging>=26.2）冲突。
      #
      # 本步建 venv 装 aqt。后续步骤用绝对路径 $HOME/aqtenv/bin/aqt 调用
      # （不靠 PATH：$GITHUB_PATH 只对后续步骤生效，步骤内调 aqt 需绝对路径）。
      - name: Setup aqt (Linux)
        if: matrix.platform == 'linux'
        run: |
          python3 -m venv "$HOME/aqtenv"
          "$HOME/aqtenv/bin/pip" install --quiet --upgrade pip setuptools packaging
          "$HOME/aqtenv/bin/pip" install --quiet --upgrade "git+https://github.com/miurahr/aqtinstall.git"
          "$HOME/aqtenv/bin/aqt" version
          echo "=== available arch for ${{ env.QT_VERSION }} (host=${{ matrix.aqt_host }}) ==="
          "$HOME/aqtenv/bin/aqt" list-qt ${{ matrix.aqt_host }} desktop --arch ${{ env.QT_VERSION }} || true

      - name: Install Qt ${{ env.QT_VERSION }} via aqt (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -e
          # qtmultimedia 是扩展模块（在 --modules 里，见 probe 输出），用 --modules
          # 安装可自动拉齐其依赖归档。arch 名已修正为 linux_gcc_64 / linux_gcc_arm64。
          # 用绝对路径调 aqt（PATH 不一定含 venv/bin）。
          "$HOME/aqtenv/bin/aqt" install-qt ${{ matrix.aqt_host }} desktop ${{ env.QT_VERSION }} \
            ${{ matrix.aqt_arch }} \
            --outputdir "$HOME/Qt" \
            --modules qtmultimedia qtserialport

          # aqt 在不同架构下落地子目录名可能不同（x86_64 多为 <ver>/gcc_64，
          # ARM64 未必是 linux_gcc_arm64）。不硬编码路径，改为按 Qt6Config.cmake
          # 实际位置反推 QT 根目录，保证任何架构都能正确定位。
          QT6CONFIG="$(find "$HOME/Qt" -name Qt6Config.cmake -path '*/cmake/Qt6/*' | head -n1)"
          if [ -z "$QT6CONFIG" ]; then
            echo "ERROR: 未找到 Qt6Config.cmake，aqt 安装目录结构如下：" >&2
            find "$HOME/Qt" -maxdepth 3 -type d >&2
            exit 1
          fi
          # QT6CONFIG = <QTDIR>/lib/cmake/Qt6/Qt6Config.cmake → QTDIR 去掉 /lib/cmake/Qt6/Qt6Config.cmake
          QTDIR="${QT6CONFIG%/lib/cmake/Qt6/Qt6Config.cmake}"
          echo "Detected QTDIR=$QTDIR"
          # QT_ROOT 供后续 Configure 步骤在命令行显式引用（-DQt6_DIR/-DCMAKE_PREFIX_PATH），
          # 不依赖环境变量在 vcpkg toolchain 下的传递（vcpkg 会主导 CMAKE_PREFIX_PATH）。
          echo "QT_ROOT=$QTDIR" >> "$GITHUB_ENV"
          echo "Qt6_DIR=$QTDIR/lib/cmake/Qt6" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$QTDIR" >> "$GITHUB_ENV"
          echo "$QTDIR/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$QTDIR/lib" >> "$GITHUB_ENV"

          # 校验 QtMultimedia 模块确实装好（cube-shell 依赖它：VoiceInput/QAudioSource）
          if [ ! -f "$QTDIR/lib/cmake/Qt6Multimedia/Qt6MultimediaConfig.cmake" ]; then
            echo "ERROR: Qt6MultimediaConfig.cmake 缺失，qtmultimedia 未正确安装" >&2
            echo "QTDIR=$QTDIR 下的 Qt6* cmake 模块：" >&2
            ls "$QTDIR/lib/cmake/" >&2 || true
            exit 1
          fi
          echo "Qt6Multimedia OK: $QTDIR/lib/cmake/Qt6Multimedia"
          # 校验 QtSerialPort 模块（串口功能模块；vcpkg.json 已移除 qtserialport，改由 Qt 提供）
          if [ ! -f "$QTDIR/lib/cmake/Qt6SerialPort/Qt6SerialPortConfig.cmake" ]; then
            echo "ERROR: Qt6SerialPortConfig.cmake 缺失，qtserialport 未正确安装" >&2
            exit 1
          fi
          echo "Qt6SerialPort OK: $QTDIR/lib/cmake/Qt6SerialPort"

      # ------------------------------------------------------- Configure
      # Windows 用 Visual Studio generator（overlay 文档基于此验证，-A 指定架构）；
      # macOS / Linux 用 Ninja。RDP 全平台开启。
      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $overlayArgs = @()
          if ('${{ matrix.overlay }}' -eq 'true') {
            $overlayArgs = @(
              '-DVCPKG_OVERLAY_TRIPLETS=vcpkg-triplets',
              '-DVCPKG_OVERLAY_PORTS=vcpkg-ports'
            )
          }
          cmake -S . -B build -G "${{ matrix.vs_generator }}" -A ${{ matrix.vs_arch }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DCUBESHELL_WITH_RDP=ON `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} `
            @overlayArgs

      - name: Configure (macOS / Linux)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          extra=()
          if [ "${{ matrix.platform }}" = "macos" ]; then
            extra+=( -DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }} )
          fi
          # Linux ARM64 无官方预编译 cmake/ninja 二进制，强制 vcpkg 用系统已装的
          # （上一步 pip 装的新版），避免它去下载 x86_64 版或回退到旧 cmake。
          if [ "${{ matrix.platform }}" = "linux" ]; then
            export VCPKG_FORCE_SYSTEM_BINARIES=1
            # 显式把 aqt 装的 Qt 传给 CMake：vcpkg toolchain 会主导 CMAKE_PREFIX_PATH
            # 环境变量，故在命令行直接给 Qt6_DIR（优先级最高）并把 QT_ROOT  prepend
            # 到 CMAKE_PREFIX_PATH，确保 find_package(Qt6) 命中 aqt 的 Qt 而非找不到。
            extra+=( -DQt6_DIR="$QT_ROOT/lib/cmake/Qt6" )
            extra+=( -DCMAKE_PREFIX_PATH="$QT_ROOT" )
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCUBESHELL_WITH_RDP=ON \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            "${extra[@]}"

      # Windows ARM64 自检：确认 OpenSSL overlay 生效（CFLAGS 含 /Od 与
      # NO_INTERLOCKEDOR64）。不生效则后续 RDP 会无声崩溃，这里直接 fail 提示。
      - name: Verify OpenSSL ARM64 overlay took effect
        if: matrix.name == 'windows-arm64'
        shell: pwsh
        run: |
          $cfg = Get-ChildItem -Recurse -Path build/vcpkg_installed -Filter configdata.pm -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -like '*openssl*' -and $_.FullName -like '*rel*' } | Select-Object -First 1
          if ($cfg) {
            $cflags = (Select-String -Path $cfg.FullName -Pattern 'CFLAGS=' ).Line
            Write-Host "OpenSSL CFLAGS: $cflags"
            if ($cflags -notmatch 'NO_INTERLOCKEDOR64') {
              Write-Error 'overlay 未生效：CFLAGS 缺少 NO_INTERLOCKEDOR64，检查 VCPKG_OVERLAY_* 参数'
              exit 1
            }
          } else {
            Write-Warning '未找到 OpenSSL configdata.pm，跳过自检'
          }

      # ----------------------------------------------------------- Build
      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      # --------------------------------------------------------- Install
      - name: Install to dist/
        shell: bash
        run: cmake --install build --config Release --prefix dist

      # ------------------------------------------------- Package (macOS)
      # 流程：macdeployqt 部署 Qt 框架/插件 → ad-hoc 重签 → hdiutil 手动打 dmg。
      #
      # 为什么必须签名：macdeployqt 重写/新增了 bundle 内的框架与可执行文件，但未
      # 签名。用户从互联网下载（带 quarantine 属性）后，Gatekeeper 校验发现无有效
      # 签名会直接报「cube-shell.app 已损坏，无法打开」。用 ad-hoc 签名
      # （codesign -s -，无开发者证书）重签整个 bundle 后，校验通过、可正常打开
      # （首次打开仍需在「系统设置→隐私与安全性」点「仍要打开」或右键→打开，
      #  但不会再误报「已损坏」）。--deep 递归签所有内嵌框架/插件，--force 覆盖
      #  macdeployqt 可能留下的不完整签名。
      #
      # 注意：签名必须是最后一步。macdeployqt -dmg 会重新跑部署逻辑、可能改动
      # bundle 而破坏签名，故改用 hdiutil 手动打 dmg（签名之后不再触碰 .app）。
      - name: Package macOS (.dmg)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -e
          # 1) 部署 Qt 框架/插件（不在这里出 dmg）
          macdeployqt dist/cube-shell.app -verbose=1

          # 1b) 瘦身：删除 Qt Multimedia 的 FFmpeg 后端及其 FFmpeg 动态库。
          # cube-shell 只用 QAudioSource 做麦克风采集（VoiceInput 语音输入），macOS 上
          # 走原生 darwin(AVFoundation/CoreAudio) 后端，用不到 FFmpeg 后端。后者会被
          # macdeployqt 连同 libavcodec.61(~28.5MB)/libavformat/libavutil/libsw* 一起
          # 拷进 bundle，纯属死重。这里在签名前删掉它们；VoiceInput 已用
          # QT_MEDIA_BACKEND=darwin 强制原生后端，绝不会回退加载 FFmpeg 后端。
          APP=dist/cube-shell.app
          rm -f "$APP"/Contents/PlugIns/multimedia/libffmpegmediaplugin.dylib
          rm -f "$APP"/Contents/Frameworks/libavcodec.*.dylib \
                "$APP"/Contents/Frameworks/libavformat.*.dylib \
                "$APP"/Contents/Frameworks/libavutil.*.dylib \
                "$APP"/Contents/Frameworks/libswresample.*.dylib \
                "$APP"/Contents/Frameworks/libswscale.*.dylib \
                "$APP"/Contents/Frameworks/libpostproc.*.dylib
          echo "=== 瘦身：已删除 FFmpeg 后端，剩余 multimedia 插件与 FFmpeg 库 ==="
          ls -la "$APP"/Contents/PlugIns/multimedia/ 2>/dev/null || true
          ls "$APP"/Contents/Frameworks/ | grep -iE 'libav|libsw|libpostproc' \
            && echo "WARNING: 仍有残留 FFmpeg 库" || echo "FFmpeg 库已清空 ✓"

          # 2) ad-hoc 签名整个 bundle（--deep 递归签内嵌框架/插件，--force 覆盖旧签名）
          codesign -s - --force --deep dist/cube-shell.app
          # 校验签名有效（ad-hoc 会显示 "Signature=adhoc"）
          codesign --verify --deep --strict --verbose=2 dist/cube-shell.app

          # 3) 签名后用 hdiutil 打 dmg（不再触碰 .app，保证签名不被破坏）
          mkdir -p out
          DMG="out/cube-shell-${{ env.APP_VERSION }}-${{ matrix.name }}.dmg"
          hdiutil create -volname "CubeShell" -srcfolder dist/cube-shell.app \
            -ov -format UDZO "$DMG"
          ls -lh out/

      # ------------------------------------------------- Package (Windows)
      # windeployqt 拷入 Qt 运行时/插件（含 qtmultimedia），整个 dist 打成绿色 zip。
      - name: Package Windows (.zip)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # x86_64 加 --no-opengl-sw：Qt 官方 x64 包自带 opengl32sw.dll（软件 OpenGL
          # 兜底）+ 其依赖 D3Dcompiler_47.dll，windeployqt 默认会一并拷入，白白多出
          # 几 MB。cube-shell 是 Qt Widgets 应用、渲染走 RHI/D3D11，用不到 CPU 光栅
          # 化兜底，故剔除以瘦身。ARM64 官方包本就不含 opengl32sw，无需此旗标。
          $extra = @()
          if ('${{ matrix.qt_arch }}' -eq 'win64_msvc2022_64') { $extra = @('--no-opengl-sw') }
          windeployqt --release --no-translations @extra dist/bin/cube-shell.exe
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $zip = "out/cube-shell-${{ env.APP_VERSION }}-${{ matrix.name }}.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          Get-Item $zip | Select-Object Name, Length

      # --------------------------------------------------- Package (Linux)
      # 简化为 tar.gz（AppImage 对 Qt6.9+Multimedia 较脆，后续可加）。目标机需自备
      # Qt6 运行库；resources/conf 已随 install 布好。
      # --------------------------------------------------- Package (Linux)
      # 做成自包含目录：把 aqt Qt 的运行库与必要插件拷进包内 dist/lib 与
      # dist/bin（插件），并用 patchelf 把 cube-shell 的 rpath 设为 $ORIGIN 相对
      # 路径——否则目标机没装 Qt 6.9 会报
      #   "error while loading shared libraries: libQt6Multimedia.so.6: cannot open..."
      # $ORIGIN 让程序从「可执行文件旁的相对目录」加载 .so，包可任意解压位置运行。
      - name: Package Linux (.tar.gz)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -e
          # patchelf 设 rpath；libxcb-cursor 等 XCB 库需先在构建机上装好，
          # 否则下面 ldd 解析平台插件依赖时它们是 "not found"，无法被收集进包。
          # x86_64 在 Rocky 8 容器（dnf，root）；ARM64 在 ubuntu 裸机（apt，sudo）。
          if [ -f /etc/redhat-release ]; then
            dnf install -y epel-release
            # XCB 库供 xcb 平台插件；wayland-cursor/wayland-egl 供 wayland 平台插件
            # （libqwayland-egl/libqwayland-generic 依赖它们，否则打包自检 not found）。
            dnf install -y patchelf \
              libxcb xcb-util xcb-util-cursor xcb-util-image xcb-util-keysyms \
              xcb-util-renderutil xcb-util-wm \
              libxkbcommon libxkbcommon-x11 \
              wayland-devel libwayland-client libwayland-cursor libwayland-egl
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends patchelf \
              libxcb-cursor0 libxkbcommon0 libxkbcommon-x11-0 \
              libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
              libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
              libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1
          fi
          QT_LIB="$QT_ROOT/lib"
          QT_PLUGINS="$QT_ROOT/plugins"

          # 1) 先拷 Qt 插件（platforms 必需，否则 GUI 起不来；多媒体/图像格式按需）。
          #    必须先于 Qt 库收集：下面第 2 步要从「主程序 + 所有插件」的 ldd 里收集
          #    它们依赖的 libQt6*，插件得先在位才能被 ldd 扫到。
          mkdir -p dist/bin/plugins
          for p in platforms platformthemes imageformats multimedia tls xcbglintegrations; do
            [ -d "$QT_PLUGINS/$p" ] && cp -r "$QT_PLUGINS/$p" dist/bin/plugins/
          done

          # 2) 收集 Qt6 共享库到 dist/lib。来源 = 主程序 + 所有插件的 ldd 依赖。
          #    关键：不能只拷主程序链接的那几个——平台插件还依赖一批主程序没直接链接、
          #    运行期才加载的 Qt 库：libQt6XcbQpa（xcb）、libQt6WaylandClient（wayland）、
          #    libQt6EglFSDeviceIntegration（eglfs）、libQt6OpenGL、libQt6Network 等。
          #    漏了它们，目标机上插件加载即报 libQt6Xxx.so.6 => not found。
          mkdir -p dist/lib
          # 2a) 从主程序 + 所有插件的 ldd 里抓每一个 libQt6*（能解析出真实路径的）
          { ldd dist/bin/cube-shell; find dist/bin/plugins -name '*.so' -exec ldd {} \; ; } \
            2>/dev/null | awk '/=> \// && /libQt6/ {print $3}' | sort -u | while read -r so; do
            [ -f "$so" ] && cp -L "$so" dist/lib/
          done
          # 2b) 兜底：把 Qt 安装目录里的 libQt6*.so.6 全部补上——ldd 静态解析可能漏掉
          #     dlopen 才加载的（如 Multimedia 后端、imageformats 运行期插件）。Qt 库
          #     体积可控，全拷最稳妥。
          cp -L "$QT_LIB"/libQt6*.so.6 dist/lib/ 2>/dev/null || true
          # Qt 运行还依赖 icu（aqt 装在 QT_LIB 下，libicui18n/libicuuc/libicudata）
          cp -L "$QT_LIB"/libicu*.so.* dist/lib/ 2>/dev/null || true

          # 2c) 平台插件（libqxcb/libqwayland）依赖一批系统 XCB/XKB 库（libxcb-cursor、
          # libxkbcommon、libxcb-xinerama 等；Qt6.5+ 的 xcb 插件强制需要 libxcb-cursor0）。
          # 目标机（尤其 minimal/服务器镜像）可能缺这些，导致插件"找到了却加载失败"：
          #   qt.qpa.plugin: Could not load the Qt platform plugin "xcb"/"wayland"
          # 用 ldd 递归收集所有插件依赖的库进 dist/lib，使包真正自包含。
          find dist/bin/plugins -name '*.so' | while read -r plug; do
            ldd "$plug" 2>/dev/null | awk '/=> \// {print $3}' | while read -r dep; do
              case "$dep" in
                # 只收集 XCB/XKB/wayland 相关与 Qt 库，跳过 libc/libm/libpthread 等系统核心库
                *libxcb*|*libxkbcommon*|*libwayland*|*libQt6*|*libX11*|*libXext*|*libXrender*|*libXau*|*libXdmcp*)
                  [ -f "$dep" ] && cp -L "$dep" dist/lib/ 2>/dev/null || true ;;
              esac
            done
          done
          # 兜底：上面 ldd 只抓得到"能解析出路径"的依赖。对关键的 XCB/XKB/wayland 库，
          # 直接从系统库缓存(ldconfig -p)按名查找并拷入，确保一个不漏。
          # 注意：xcb-util-cursor 在 Rocky/RHEL 上不带 libxcb-util.so，lxcb-util 仅
          # Ubuntu 有；Rocky 上查不到就跳过，不致命。
          # wayland-cursor/wayland-egl/wayland-client 是 wayland 平台插件
          # （libqwayland-egl/libqwayland-generic）的依赖，漏了会在目标机报 not found。
          for lib in libxcb-cursor.so.0 libxkbcommon.so.0 libxkbcommon-x11.so.0 \
                     libxcb-icccm.so.4 libxcb-image.so.0 libxcb-keysyms.so.1 \
                     libxcb-randr.so.0 libxcb-render-util.so.0 libxcb-shape.so.0 \
                     libxcb-shm.so.0 libxcb-sync.so.1 libxcb-xfixes.so.0 \
                     libxcb-xinerama.so.0 libxcb-xkb.so.1 libxcb-util.so.1 libxcb-render.so.0 libxcb.so.1 \
                     libwayland-client.so.0 libwayland-cursor.so.0 libwayland-egl.so.1; do
            [ -f "dist/lib/$lib" ] && continue   # 已收集过则跳过
            src="$(ldconfig -p | awk -v L="$lib" '$1==L {print $NF; exit}')"
            [ -n "$src" ] && [ -f "$src" ] && cp -L "$src" "dist/lib/$lib" 2>/dev/null || true
          done

          # 2d) C++ 运行库随包：libstdc++/libgcc_s 是「glibc 之外」老系统最常见的第二道坎。
          # 目标老系统（如 RHEL8 自带 GCC8 的 libstdc++）可能没有程序用到的 GLIBCXX_3.4.26+
          # 符号，导致起不来。把它们打进 dist/lib，由 DT_RPATH 优先加载——包内版本来自
          # 构建底座（glibc 2.28），在更新的系统上也能正常加载（glibc 向下兼容），
          # 故对所有目标系统统一随包最稳。glibc 本身（libc/libm/libpthread）不打——
          # 那必须跟目标机内核/系统匹配，由「在 glibc 2.28 底座构建」保证向下兼容。
          for lib in libstdc++.so.6 libgcc_s.so.1; do
            [ -f "dist/lib/$lib" ] && continue
            src="$(ldconfig -p | awk -v L="$lib" '$1==L {print $NF; exit}')"
            [ -n "$src" ] && [ -f "$src" ] && cp -L "$src" "dist/lib/$lib" || true
          done

          # 3) 设 rpath：cube-shell 从 $ORIGIN/../lib 找 Qt 库，从 $ORIGIN/plugins 找插件。
          # 必须用 --force-rpath 写成 DT_RPATH 而非默认的 DT_RUNPATH：
          #   libxcb-cursor.so.0 是 Qt 运行期 dlopen() 打开的，dlopen 的库【不继承】
          #   调用者的 DT_RUNPATH，但【继承】DT_RPATH。若写成 RUNPATH，目标机上
          #   dlopen libxcb-cursor 会因搜不到包内 lib/ 而失败，Qt 报
          #   "xcb-cursor0 or libxcb-cursor0 is needed"，xcb 插件加载失败。
          patchelf --force-rpath --set-rpath '$ORIGIN/../lib' dist/bin/cube-shell
          # 插件里的 .so 也需能找到 Qt 库与 XCB 库。注意上溯级数：
          #   插件在 dist/bin/plugins/<组>/xxx.so（三层深），其 $ORIGIN 是
          #   dist/bin/plugins/<组>，要回到 dist/lib 需上溯【三级】——$ORIGIN/../../../lib。
          #   之前误写为 ../../（两级）= dist/bin/lib，与库实际所在的 dist/lib 差一级，
          #   导致所有插件报 libQt6Core.so.6 not found（主程序 $ORIGIN/../lib 恰好对，
          #   所以主程序自检能过、插件全挂）。
          find dist/bin/plugins -name '*.so' -exec patchelf --force-rpath --set-rpath '$ORIGIN/../../../lib' {} \; 2>/dev/null || true

          # 4) 提供一个 qt.conf，让 Qt 从可执行文件旁的 plugins/ 加载插件
          printf '[Paths]\nPlugins = plugins\n' > dist/bin/qt.conf

          # 4d) 诊断：把 dist/lib 的实际内容与插件 RPATH 打出来，便于定位"缺库"根因。
          echo "=== DIAG: QT_ROOT=$QT_ROOT  QT_LIB=$QT_LIB ==="
          echo "=== DIAG: Qt 安装目录 libQt6Core/Gui 是否存在 ==="
          ls -la "$QT_LIB"/libQt6Core.so.6 "$QT_LIB"/libQt6Gui.so.6 2>&1 | head
          echo "=== DIAG: dist/lib 里的 libQt6*.so.6 数量与清单 ==="
          ls dist/lib/libQt6*.so.6 2>/dev/null | wc -l
          ls dist/lib/ | grep -i 'libQt6' | head -40
          echo "=== DIAG: dist/lib 全部文件数 ==="
          ls dist/lib/ | wc -l
          echo "=== DIAG: libqxcb 的 RPATH/RUNPATH ==="
          readelf -d dist/bin/plugins/platforms/libqxcb.so 2>/dev/null | grep -iE 'rpath|runpath'
          echo "=== DIAG: 主程序 RPATH/RUNPATH ==="
          readelf -d dist/bin/cube-shell 2>/dev/null | grep -iE 'rpath|runpath'

          # 5) 自检：模拟目标机环境（清空 LD_LIBRARY_PATH，纯靠二进制内的 DT_RPATH
          # 解析依赖），确认主程序与平台插件都不再有 not found。
          # 关键：不能再用 LD_LIBRARY_PATH=dist/lib 来测——LD_LIBRARY_PATH 对 dlopen
          # 也生效，会掩盖 DT_RUNPATH 不传递给 dlopen 子依赖的缺陷（本仓库就踩过：
          # CI 自检全绿，目标机上 libxcb-cursor dlopen 失败）。清空它才是真环境。
          echo "=== ldd self-check (no LD_LIBRARY_PATH, pure RPATH): cube-shell ==="
          env -u LD_LIBRARY_PATH ldd dist/bin/cube-shell | grep -i "not found" && {
            echo "ERROR: 主程序仍有未解析依赖" >&2; exit 1; } || echo "主程序依赖已自包含 ✓"
          echo "=== ldd self-check (no LD_LIBRARY_PATH): platform plugins ==="
          MISS=0
          for plug in dist/bin/plugins/platforms/*.so; do
            [ -f "$plug" ] || continue
            if env -u LD_LIBRARY_PATH ldd "$plug" 2>/dev/null | grep -i "not found"; then
              echo "ERROR: 插件 $plug 有未解析依赖" >&2; MISS=1
            fi
          done
          [ "$MISS" = "1" ] && exit 1 || echo "平台插件依赖已自包含 ✓"
          # 说明：dlopen 路径（libxcb-cursor 等）无法被 ldd 静态覆盖，其可达性由上面
          # patchelf --force-rpath 写入的 DT_RPATH 保证（DT_RPATH 会被 dlopen 的子依赖
          # 继承，而 DT_RUNPATH 不会）。这里清空 LD_LIBRARY_PATH 的纯 RPATH ldd 自检，
          # 已能在目标机视角暴露绝大多数「库不在包内/不在 rpath」的问题。

          # 6) 打包
          mkdir -p out
          tar -czf "out/cube-shell-${{ env.APP_VERSION }}-${{ matrix.name }}.tar.gz" -C dist .
          ls -lh out/

      # --------------------------------------------------------- Artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cube-shell-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  # ============================================================ Release
  # 打 v* tag 时，等全部 6 平台构建完成后，把所有 artifact 上传到该 tag 的 Release。
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
